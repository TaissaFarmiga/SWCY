import groovy.json.JsonSlurper
import java.util.Properties

// ============================================================
// 防御性动态版本解析 —— 从根目录 package.json 提取版本号
// versionCode 映射规则: "1.3.0" -> 10300 (主*10000 + 次*100 + 补丁)
// ============================================================
def getPackageJsonInfo() {
    def packageJsonFile = file("../../package.json")
    if (packageJsonFile.exists()) {
        try {
            def parsedJson = new JsonSlurper().parseText(packageJsonFile.text)
            return parsedJson
        } catch (Exception e) {
            println("Warning: Failed to parse package.json, using fallback values.")
        }
    }
    return null
}

def extPackageJson = getPackageJsonInfo()

// 动态计算字符串版本号 (versionName)
def computedVersionName = (extPackageJson != null && extPackageJson.version != null) ? extPackageJson.version : "1.0.0"

// 动态计算整型版本号 (versionCode) -> 将 "1.4.1" 映射为数学级递增的 10401，防止沙盒锁死
def computedVersionCode = 1
if (extPackageJson != null && extPackageJson.version != null) {
    try {
        def parts = extPackageJson.version.split("\\.")
        if (parts.length >= 3) {
            computedVersionCode = parts[0].toInteger() * 10000 + parts[1].toInteger() * 100 + parts[2].toInteger()
        }
    } catch (Exception e) {
        computedVersionCode = (int)(System.currentTimeMillis() / 100000) // 降级为时间戳防重
    }
}

println("Dynamic version: versionName=${computedVersionName}, versionCode=${computedVersionCode}")

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('keystore.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}

def releaseSetting = { String propertyName, String environmentName ->
    def propertyValue = releaseProperties.getProperty(propertyName)
    return propertyValue?.trim() ? propertyValue.trim() : System.getenv(environmentName)?.trim()
}

def releaseStorePath = releaseSetting('storeFile', 'HYDRO_KEYSTORE_PATH')
def releaseStorePassword = releaseSetting('storePassword', 'HYDRO_KEYSTORE_PASSWORD')
def releaseKeyAlias = releaseSetting('keyAlias', 'HYDRO_KEY_ALIAS')
def releaseKeyPassword = releaseSetting('keyPassword', 'HYDRO_KEY_PASSWORD')
def releaseSigningAvailable = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

apply plugin: 'com.android.application'

android {
    namespace = "com.hydro.geekterminal"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.hydro.geekterminal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName computedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions += "distribution"
    productFlavors {
        enterprise {
            dimension "distribution"
        }
        store {
            dimension "distribution"
            applicationIdSuffix ".store"
        }
        smoke {
            dimension "distribution"
            applicationIdSuffix ".smoke"
        }
    }
    signingConfigs {
        release {
            if (releaseSigningAvailable) {
                storeFile rootProject.file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug { }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningAvailable) signingConfig signingConfigs.release
        }
    }
    testOptions {
        managedDevices {
            devices {
                pixel2Api35(com.android.build.api.dsl.ManagedVirtualDevice) {
                    device = "Pixel 2"
                    apiLevel = 35
                    systemImageSource = "aosp-atd"
                }
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseBuildRequested = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(?i)(assemble|bundle).+Release/
    }
    if (releaseBuildRequested && !releaseSigningAvailable) {
        throw new GradleException('正式构建缺少签名配置。请设置 HYDRO_KEYSTORE_PATH、HYDRO_KEYSTORE_PASSWORD、HYDRO_KEY_ALIAS、HYDRO_KEY_PASSWORD，或创建未跟踪的 android/keystore.properties。')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.test.espresso:espresso-web:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
